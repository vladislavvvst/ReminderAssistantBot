name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.304"

      - name: Restore
        run: dotnet restore

      - name: Build (src)
        run: |
          set -euo pipefail
          for proj in $(find src -name "*.csproj" | sort); do
            echo "Building $proj"
            dotnet build "$proj" -c Release --no-restore
          done

      - name: Test (tests)
        run: |
          set -euo pipefail
          for proj in $(find tests -name "*.csproj" | sort); do
            echo "Testing $proj"
            dotnet test "$proj" -c Release --verbosity normal
          done
